<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart App - Resident & Staff Management</title>
  
  <!-- Import our global styles -->
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <!-- Main container -->
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>🏥 Smart App</h1>
      <p>Resident & Staff Management System</p>
    </header>

    <!-- Navigation -->
    <nav class="nav">
      <button class="nav-button active" data-page="residents">👥 Residents</button>
      <button class="nav-button" data-page="staff">👨‍⚕️ Staff</button>
      <button class="nav-button" data-page="tasks">📋 Tasks</button>
    </nav>

    <!-- Main content area -->
    <main class="main-content">
      <!-- Residents Page -->
      <div id="residents-page" class="page active">
        <div class="page-layout">
          <div class="form-section">
            <resident-form></resident-form>
          </div>
          <div class="list-section">
            <resident-list></resident-list>
          </div>
        </div>
      </div>

      <!-- Staff Page -->
      <div id="staff-page" class="page">
        <div class="page-layout">
          <div class="form-section">
            <staff-form></staff-form>
          </div>
          <div class="list-section">
            <staff-list></staff-list>
          </div>
        </div>
      </div>

      <!-- Tasks Page -->
      <div id="tasks-page" class="page">
        <div class="page-content">
          <h2>📋 Tasks Management</h2>
          <p>Task management features coming soon!</p>
          <p>This will include:</p>
          <ul>
            <li>Creating and assigning tasks to staff members</li>
            <li>Setting priorities and due dates</li>
            <li>Tracking task completion status</li>
            <li>Linking tasks to specific residents</li>
          </ul>
        </div>
      </div>
    </main>
  </div>

  <!-- Import our web components -->
  <script type="module" src="/src/components/resident-form.ts"></script>
  <script type="module" src="/src/components/resident-list.ts"></script>
  <script type="module" src="/src/components/staff-form.ts"></script>
  <script type="module" src="/src/components/staff-list.ts"></script>

  <!-- Navigation script -->
  <script>
    // Simple navigation between pages
    document.addEventListener('DOMContentLoaded', function() {
      const navButtons = document.querySelectorAll('.nav-button');
      const pages = document.querySelectorAll('.page');

      navButtons.forEach(button => {
        button.addEventListener('click', function() {
          const targetPage = this.getAttribute('data-page');
          
          // Update active nav button
          navButtons.forEach(btn => btn.classList.remove('active'));
          this.classList.add('active');
          
          // Show target page
          pages.forEach(page => {
            page.classList.remove('active');
            if (page.id === `${targetPage}-page`) {
              page.classList.add('active');
            }
          });
        });
      });
    });
  </script>
</body>
</html>
