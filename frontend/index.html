<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 16px;
      }
      .nav button {
        margin-right: 8px;
      }
      .page {
        display: none;
        margin-top: 16px;
      }
      .page.active {
        display: block;
      }
      .nav .active {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Smart App</h1>

    <div class="nav">
      <button onclick="showPage(event, 'residents')" class="active">
        Residents
      </button>
      <button onclick="showPage(event, 'staff')">Staff</button>
      <button onclick="showPage(event, 'tasks')">Tasks</button>
    </div>

    <!-- Residents Page -->
    <div id="residents-page" class="page active">
      <h2>Add Resident</h2>
      <resident-form></resident-form>

      <h2>Residents</h2>
      <resident-list></resident-list>
    </div>

    <!-- Staff Page -->
    <div id="staff-page" class="page">
      <h2>Add Staff</h2>
      <staff-form></staff-form>

      <h2>Staff</h2>
      <staff-list></staff-list>
    </div>

    <!-- Tasks Page -->
    <div id="tasks-page" class="page">
      <h2>Add Task</h2>
      <task-form></task-form>

      <h2>Tasks</h2>
      <task-list></task-list>
    </div>


ask form and task list dont show up
<script>
      function showPage(evt, pageName) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelectorAll(".nav button")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById(pageName + "-page")?.classList.add("active");
        evt.target.classList.add("active");
      }
    </script>

    <!-- Load compiled JS generated from your TypeScript components -->
    <script src="dist/components/resident-form.js"></script>
    <script src="dist/components/resident-list.js"></script>
    <script src="dist/components/staff-form.js"></script>
    <script src="dist/components/staff-list.js"></script>
    <script src="dist/components/task-form.js"></script>
    <script src="dist/components/task-list.js"></script>
  </body>
</html>
