<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Management System</title>
    <style>
        /* Simple professional styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .header {
            background-color: #2c5aa0;
            color: white;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .nav {
            background-color: white;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        
        .nav button {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        
        .nav button:hover {
            background-color: #e0e0e0;
        }
        
        .nav button.active {
            background-color: #2c5aa0;
            color: white;
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Healthcare Management System</h1>
            <p>Resident Care • Staff Management • Task Coordination</p>
        </div>
        
        <!-- Navigation -->
        <div class="nav">
            <button onclick="showPage('residents')" class="active">Residents</button>
            <button onclick="showPage('staff')">Staff</button>
            <button onclick="showPage('tasks')">Tasks</button>
        </div>
        
        <!-- Residents Page -->
        <div id="residents-page" class="page active">
            <resident-form></resident-form>
            <resident-list></resident-list>
        </div>
        
        <!-- Staff Page -->
        <div id="staff-page" class="page">
            <staff-form></staff-form>
            <staff-list></staff-list>
        </div>
        
        <!-- Tasks Page -->
        <div id="tasks-page" class="page">
            <task-form></task-form>
            <task-list></task-list>
        </div>
    </div>

    <!-- Simple JavaScript for page switching -->
    <script>
        function showPage(pageName) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.nav button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Show the selected page
            document.getElementById(pageName + '-page').classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
        }
    </script>

    <!-- Load our simple TypeScript components -->
    <script type="module" src="dist/components/resident-form.js"></script>
    <script type="module" src="dist/components/resident-list.js"></script>
    <script type="module" src="dist/components/staff-form.js"></script>
    <script type="module" src="dist/components/staff-list.js"></script>
    <script type="module" src="dist/components/task-form.js"></script>
    <script type="module" src="dist/components/task-list.js"></script>
</body>
</html>
